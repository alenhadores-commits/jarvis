[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-router-local"
version = "1.0.0"
description = "IA Router local e plugável"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools]
py-modules = [
    "api_router",
    "api_manager",
    "ia_router_sdk"
]
